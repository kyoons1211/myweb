<!DOCTYPE html>
<html>

<head>
    <title>내 웹페이지 20255274 강윤서</title>
    <meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1">
    <style>
        @font-face {
            font-family: 'BookkMyungjo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'BookkMyungjo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        .font_big {
            font-size: 2em;
        }

        .font_small {
            font-size: 0.9em;
        }

        .font_italic {
            font-style: italic;
        }

        .font_bold {
            font-weight: bold;
        }

        .font_center {
            text-align: center;
        }

        .font_right {
            text-align: right;
        }

        .font_left {
            text-align: left;
        }

        * {
            margin: 0;
            padding: 0;
        }

        body {
            width: 960px;
            margin: 0 auto;
        }

        #section {
            width: 700px;
            margin: 40px auto;
            background-color: #fbfbfb;
            padding: 40px;
            border-radius: 8px;
            font-family: 'BookkMyungjo';
            text-align: center;
        }

        @media screen and (max-width: 767px) {
            body {
                width: auto
            }

            #section {
                width: auto;
                margin: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="section">
        <h1 class="font_big font_bold font_center">빈집</h1>
        <p class="font_right font_small">기형도</p>
        <br>
        <p>사랑을 잃고 나는 쓰네</p>
        <br>
        <p>잘 있거나, 짧았던 밤들아</p>
        <p>창밖을 떠돌던 겨울안개들아</p>
        <p>아무것도 모르던 촛불들아, 잘 있거나</p>
        <p>공포를 기다리던 흰 종이들아</p>
        <p>망설임을 대신하던 눈물들아</p>
        <p>잘 있거라, 더 이상 내 것이 아닌 열망들아</p>
        <br>
        <p>장님처럼 나 이제 더듬거리며 문을 잠그네</p>
        <p>가엾은 내 사랑 빈집에 갇혔네</p>
    </div>
</body>

</html>
